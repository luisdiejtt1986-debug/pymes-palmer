<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ============================================================
   CIMA — Design tokens
   ============================================================ */
:root{
  --bg-grad: radial-gradient(circle at 18% -8%, #2c2470 0%, transparent 52%),
             radial-gradient(circle at 100% 105%, #0c3b45 0%, transparent 52%),
             linear-gradient(180deg,#0a0e27,#070a1c 70%);
  --surface: rgba(255,255,255,0.055);
  --surface-2: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.13);
  --border-strong: rgba(255,255,255,0.22);
  --text-0:#f4f6ff;
  --text-1:#aab0d6;
  --text-2:#7a80a8;
  --violet:#7c6cf6;
  --violet-2:#5b4fe0;
  --teal:#22e0c4;
  --gold:#ffc861;
  --gold-2:#ffb02e;
  --coral:#ff6b7a;
  --shadow-soft: 0 10px 36px rgba(4,4,20,0.45);
  --shadow-pop: 0 18px 50px rgba(124,108,246,0.35);
  --radius-l:26px;
  --radius-m:18px;
  --radius-s:12px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
[data-theme="light"]{
  --bg-grad: radial-gradient(circle at 15% -10%, #e3ddff 0%, transparent 55%),
             radial-gradient(circle at 100% 110%, #cdf5ee 0%, transparent 55%),
             linear-gradient(180deg,#f9faff,#eef0f9 70%);
  --surface: rgba(255,255,255,0.62);
  --surface-2: rgba(255,255,255,0.85);
  --border: rgba(30,30,60,0.09);
  --border-strong: rgba(30,30,60,0.16);
  --text-0:#161a33;
  --text-1:#565b7c;
  --text-2:#888fb0;
  --violet:#6c5ce7;
  --violet-2:#5341d6;
  --teal:#0aab95;
  --gold:#dd9a2c;
  --gold-2:#c98412;
  --coral:#e0535f;
  --shadow-soft: 0 10px 30px rgba(40,40,90,0.10);
  --shadow-pop: 0 18px 40px rgba(108,92,231,0.22);
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family: var(--font-body);
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text-0);
  min-height:100vh;
  transition: background .4s ease, color .4s ease;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 26px 26px;
  opacity:.5;
}
[data-theme="light"] body::before{ background-image: radial-gradient(rgba(20,20,50,0.035) 1px, transparent 1px); }

#app{ position:relative; z-index:1; max-width:560px; margin:0 auto; min-height:100vh; padding: 18px 18px 48px; display:flex; flex-direction:column; }
@media(min-width:760px){ #app{ max-width:680px; padding:32px 32px 56px; } }

h1,h2,h3,.display{ font-family: var(--font-display); letter-spacing:-0.01em; }
.mono{ font-family: var(--font-mono); }
button{ font-family: inherit; cursor:pointer; border:none; background:none; color:inherit; }
input{ font-family: inherit; }
a{ color:inherit; }

/* ---------- glass surfaces ---------- */
.glass{
  background: var(--surface);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-soft);
}
.glass-tight{ border-radius: var(--radius-m); }

/* ---------- top bar ---------- */
.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
.brand{ display:flex; align-items:center; gap:9px; }
.brand-mark{ width:34px; height:34px; display:grid; place-items:center; border-radius:11px;
  background: linear-gradient(145deg, var(--violet), var(--violet-2)); box-shadow: var(--shadow-pop); flex:none; }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.02em; }
.brand-name span{ color: var(--gold); }

.icon-btn{ width:40px; height:40px; border-radius:13px; display:grid; place-items:center;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-1); transition:transform .15s ease, color .15s ease, border-color .15s ease; }
.icon-btn:hover{ color:var(--text-0); border-color:var(--border-strong); transform:translateY(-1px); }
.icon-btn:active{ transform: scale(.93); }

/* ============================================================
   HOME
   ============================================================ */
.user-card{ padding:22px 22px 24px; margin-bottom:16px; position:relative; overflow:hidden; }
.user-card::after{ content:""; position:absolute; width:200px; height:200px; border-radius:50%;
  background: radial-gradient(circle, rgba(124,108,246,0.35), transparent 70%); top:-90px; right:-60px; pointer-events:none; }
.user-row{ display:flex; align-items:center; gap:14px; position:relative; }
.avatar{ width:58px; height:58px; border-radius:18px; flex:none; display:grid; place-items:center;
  background: linear-gradient(150deg, var(--gold), var(--gold-2)); color:#241500; font-family:var(--font-display); font-weight:700; font-size:21px;
  box-shadow: 0 8px 22px rgba(255,193,97,0.35); }
.user-meta{ flex:1; min-width:0; }
.user-greeting{ font-size:13px; color:var(--text-1); margin-bottom:3px; }
.name-input{ background:transparent; border:none; outline:none; color:var(--text-0); font-family:var(--font-display);
  font-weight:600; font-size:20px; width:100%; padding:0; border-bottom:1px dashed transparent; }
.name-input:focus{ border-bottom-color: var(--border-strong); }
.level-pill{ display:inline-flex; align-items:center; gap:6px; margin-top:6px; padding:4px 10px 4px 6px; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--border); font-size:12px; font-weight:600; color: var(--gold); }
.level-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); }

.xp-block{ margin-top:18px; }
.xp-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
.xp-row .lbl{ font-size:12px; color:var(--text-1); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
.xp-row .val{ font-family:var(--font-mono); font-size:12px; color:var(--text-1); }
.bar-track{ height:10px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; }
.bar-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--violet), var(--teal)); transition:width .9s cubic-bezier(.2,.9,.25,1); }

.stat-row{ display:flex; gap:10px; margin-top:18px; }
.stat-chip{ flex:1; padding:12px 12px; border-radius:var(--radius-s); background:var(--surface-2); border:1px solid var(--border); text-align:center; }
.stat-chip .num{ font-family:var(--font-mono); font-weight:700; font-size:17px; display:flex; align-items:center; justify-content:center; gap:5px;}
.stat-chip .lbl{ font-size:10.5px; color:var(--text-1); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }

.cta-main{ width:100%; margin-top:18px; padding:18px 20px; border-radius:20px; display:flex; align-items:center; justify-content:center; gap:10px;
  background: linear-gradient(120deg, var(--violet), var(--violet-2) 60%, var(--teal) 130%); color:#fff; font-family:var(--font-display); font-weight:700; font-size:17px;
  box-shadow: var(--shadow-pop); position:relative; overflow:hidden; transition: transform .18s ease, box-shadow .18s ease; }
.cta-main:hover{ transform:translateY(-2px); box-shadow:0 22px 56px rgba(124,108,246,0.45); }
.cta-main:active{ transform: scale(.98); }
.cta-main .shine{ position:absolute; inset:0; background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%); transform:translateX(-120%); animation: shine 3.2s ease-in-out infinite; }
@keyframes shine{ 0%,60%{transform:translateX(-120%);} 100%{transform:translateX(120%);} }

.section-label{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-1); margin: 22px 2px 10px; display:flex; align-items:center; gap:7px;}

.chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px; scrollbar-width:none;}
.chip-row::-webkit-scrollbar{ display:none; }
.chip{ flex:none; padding:9px 15px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:13.5px; font-weight:600; color:var(--text-1); transition: all .15s ease;}
.chip.active{ background: linear-gradient(120deg, var(--violet), var(--violet-2)); color:#fff; border-color:transparent; box-shadow:0 6px 18px rgba(124,108,246,0.3);}
.chip:hover:not(.active){ color:var(--text-0); border-color:var(--border-strong);}

.quick-row{ display:flex; gap:12px; margin-top:6px; }
.quick-card{ flex:1; padding:16px; display:flex; flex-direction:column; gap:8px; transition:transform .15s ease, border-color .15s ease; }
.quick-card:hover{ transform:translateY(-2px); border-color:var(--border-strong); }
.quick-card .qicon{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--surface-2); }
.quick-card .qtitle{ font-weight:700; font-size:14.5px; }
.quick-card .qsub{ font-size:11.5px; color:var(--text-1); }

.footer-note{ text-align:center; font-size:12px; color:var(--text-2); margin-top:30px; line-height:1.6; }

/* ============================================================
   PLAY SCREEN
   ============================================================ */
.play-top{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.cat-chip{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:6px 12px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--teal); flex:none; }
.q-progress-text{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-1); flex:1; text-align:right; }

.path-strip{ display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none; }
.path-strip::-webkit-scrollbar{display:none;}
.path-node{ flex:none; width:30px; height:30px; border-radius:10px; display:grid; place-items:center; font-family:var(--font-mono); font-size:10.5px; font-weight:700;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); transition: all .3s ease; }
.path-node.done{ background: linear-gradient(150deg, var(--gold), var(--gold-2)); color:#241500; border-color:transparent; }
.path-node.current{ background: linear-gradient(150deg, var(--violet), var(--violet-2)); color:#fff; border-color:transparent; box-shadow:0 0 0 4px rgba(124,108,246,0.22); transform:scale(1.12); }

.timer-wrap{ display:flex; justify-content:center; margin-bottom:6px; }
.timer-ring-box{ position:relative; width:74px; height:74px; }
.timer-ring-box svg{ transform:rotate(-90deg); width:74px; height:74px; }
.timer-ring-bg{ fill:none; stroke:var(--surface-2); stroke-width:6; }
.timer-ring-fg{ fill:none; stroke:var(--teal); stroke-width:6; stroke-linecap:round; transition: stroke-dashoffset 1s linear, stroke .3s ease; }
.timer-num{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--font-mono); font-weight:700; font-size:19px; }

.q-card{ padding:26px 22px; margin-top:14px; }
.q-text{ font-family:var(--font-display); font-weight:600; font-size:20px; line-height:1.4; margin-bottom:22px; }
@media(min-width:760px){ .q-text{ font-size:23px; } }

.answers-grid{ display:grid; grid-template-columns:1fr; gap:11px; }
@media(min-width:600px){ .answers-grid{ grid-template-columns:1fr 1fr; } }

.answer-btn{ display:flex; align-items:center; gap:12px; text-align:left; padding:15px 16px; border-radius:16px; background:var(--surface-2);
  border:1.5px solid var(--border); font-size:15px; font-weight:600; color:var(--text-0); transition: all .16s ease; position:relative; }
.answer-btn:hover:not(.locked):not(.correct):not(.wrong){ border-color: var(--violet); background: rgba(124,108,246,0.10); transform:translateY(-1px); }
.answer-btn .letter{ width:26px; height:26px; border-radius:8px; flex:none; display:grid; place-items:center; background:var(--surface); border:1px solid var(--border);
  font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--text-1); }
.answer-btn.correct{ background: rgba(34,224,196,0.16); border-color: var(--teal); color: var(--teal); }
.answer-btn.correct .letter{ background:var(--teal); color:#06281f; border-color:transparent; }
.answer-btn.wrong{ background: rgba(255,107,122,0.14); border-color: var(--coral); color: var(--coral); animation: shake .42s ease; }
.answer-btn.wrong .letter{ background:var(--coral); color:#2a0a0d; border-color:transparent; }
.answer-btn.faded{ opacity:.32; pointer-events:none; }
.answer-btn.locked{ pointer-events:none; }
.answer-btn .mark{ margin-left:auto; font-size:16px; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(5px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(3px);} }

.audience-box{ margin-top:14px; padding:14px 16px; }
.audience-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; }
.audience-row:last-child{ margin-bottom:0; }
.audience-row .al{ width:18px; font-family:var(--font-mono); font-weight:700; color:var(--text-1); flex:none;}
.audience-bar-track{ flex:1; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.audience-bar-fill{ height:100%; background:linear-gradient(90deg,var(--violet),var(--teal)); border-radius:99px; transition:width .8s ease; }
.audience-pct{ font-family:var(--font-mono); font-size:12px; color:var(--text-1); width:34px; text-align:right; flex:none;}

.lifelines{ display:flex; gap:10px; margin:16px 0 4px; }
.life-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:11px; font-weight:600; color:var(--text-1); transition:all .15s ease;}
.life-btn .lemo{ font-size:18px; }
.life-btn:hover:not(:disabled){ border-color:var(--violet); color:var(--text-0); transform:translateY(-1px);}
.life-btn:disabled{ opacity:.3; }

.feedback-banner{ margin-top:16px; padding:15px 18px; border-radius:16px; display:flex; align-items:center; gap:12px; font-weight:600; font-size:14.5px; animation: rise .35s ease; }
.feedback-banner.ok{ background: rgba(34,224,196,0.14); border:1px solid var(--teal); color:var(--teal); }
.feedback-banner.bad{ background: rgba(255,107,122,0.14); border:1px solid var(--coral); color:var(--coral); }
.feedback-banner .xp-gain{ margin-left:auto; font-family:var(--font-mono); font-size:13px; }
@keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.continue-btn{ margin-top:14px; width:100%; padding:14px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border-strong); font-weight:700; }
.continue-btn:hover{ border-color:var(--violet); }

/* ============================================================
   RESULTS
   ============================================================ */
.results-hero{ text-align:center; padding:34px 22px 26px; }
.score-ring-box{ width:160px; height:160px; margin:0 auto 16px; position:relative; }
.score-ring-box svg{ transform:rotate(-90deg); width:160px; height:160px; }
.score-ring-bg{ fill:none; stroke:var(--surface-2); stroke-width:11; }
.score-ring-fg{ fill:none; stroke-linecap:round; stroke-width:11; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.9,.25,1); }
.score-ring-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.score-ring-label .pct{ font-family:var(--font-display); font-weight:700; font-size:34px; }
.score-ring-label .frac{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-1); margin-top:2px;}
.results-title{ font-family:var(--font-display); font-weight:700; font-size:21px; margin-bottom:6px; }
.results-sub{ font-size:13.5px; color:var(--text-1); max-width:340px; margin:0 auto; line-height:1.55; }

.results-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0; }
.rs-card{ padding:14px 8px; text-align:center; }
.rs-card .num{ font-family:var(--font-mono); font-weight:700; font-size:18px; }
.rs-card .lbl{ font-size:10px; color:var(--text-1); text-transform:uppercase; letter-spacing:.04em; margin-top:3px; }

.badge-unlock-row{ display:flex; gap:10px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none;}
.badge-unlock-row::-webkit-scrollbar{display:none;}
.badge-card-mini{ flex:none; width:108px; padding:14px 10px; text-align:center; animation: popIn .5s cubic-bezier(.2,.9,.25,1.3) both; }
.badge-card-mini .bicon{ font-size:26px; margin-bottom:6px; }
.badge-card-mini .bname{ font-size:11.5px; font-weight:700; line-height:1.3; }
@keyframes popIn{ from{ opacity:0; transform:scale(.6) translateY(10px);} to{opacity:1; transform:scale(1) translateY(0);} }

.reco-box{ padding:16px 18px; margin-top:6px; display:flex; gap:12px; align-items:flex-start; }
.reco-box .ricon{ font-size:20px; flex:none; }
.reco-box p{ font-size:13.5px; color:var(--text-1); line-height:1.55; }

.results-actions{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-secondary{ width:100%; padding:14px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border-strong); font-weight:700; font-size:14.5px; transition:all .15s ease;}
.btn-secondary:hover{ border-color:var(--violet); }

/* ============================================================
   PROGRESS / ACHIEVEMENTS OVERLAY
   ============================================================ */
.overlay{ position:fixed; inset:0; z-index:50; background:rgba(4,4,16,0.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .25s ease; }

@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@media(min-width:620px){ .overlay{ align-items:center; } }
.sheet{ width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:28px 28px 0 0; padding:22px 20px 30px; animation:slideUp .32s cubic-bezier(.2,.9,.25,1); }
@media(min-width:620px){ .sheet{ border-radius:28px; max-height:84vh; } }
@keyframes slideUp{ from{ transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }

.week-strip{ display:flex; gap:7px; justify-content:space-between; margin:14px 0 6px; }

.row{ display:flex; align-items:center; }
.gap8{ gap:8px;} .gap10{gap:10px;} .gap12{gap:12px;}

<div id="app"></div>

<script>
/* ============================================================
   CIMA — Trivia gamificada
   App de una sola página, sin dependencias externas.
   ============================================================ */

/* ---------------- Datos: preguntas ---------------- */
const QUESTIONS = [

/* ---------------- Nivel / XP ---------------- */
function xpForLevel(n){ return 220*n*n; } // xp acumulada requerida para alcanzar el nivel n+1
function computeLevel(xp){
  let level = 1;
  while(xp >= xpForLevel(level)) level++;
  const prevThresh = level===1 ? 0 : xpForLevel(level-1);
  const nextThresh = xpForLevel(level);
  const into = xp - prevThresh;
  const span = nextThresh - prevThresh;
  return { level, name: levelName(level), into, span, nextThresh, prevThresh, pct: Math.min(100, Math.round((into/span)*100)) };
}
function levelName(level){
  if(level<=2) return "Explorador";
  if(level<=4) return "Aprendiz";
  if(level<=7) return "Estratega";
  if(level<=10) return "Sabio";
  if(level<=14) return "Mente Brillante";
  return "Leyenda de la Cima";
}

}

function registerPlayToday(){
  const today = todayISO();
  const u = state.user;
  if(u.lastPlayDate === today) return; // ya contabilizado hoy
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(u.lastPlayDate === yesterday){ u.streak += 1; }
  else { u.streak = 1; }
  u.lastPlayDate = today;
  u.playDates = (u.playDates||[]).concat(today).slice(-30);
}

   ============================================================ */
function startSession(){
  let pool = state.categoryFilter==="Todas" ? QUESTIONS : QUESTIONS.filter(q=>q.cat===state.categoryFilter);
  if(pool.length < ROUND_SIZE) pool = QUESTIONS; // fallback de seguridad
  const picked = shuffle(pool).slice(0, ROUND_SIZE).map(q=>{
    const order = shuffle(q.opts.map((text,i)=>({text, correct:i===q.correct})));
    return { cat:q.cat, question:q.q, options: order };
  });
  state.session = {
    questions: picked,
    index: 0,
    correctCount: 0,
    xpEarned: 0,
    timeLeft: TIME_PER_Q,
    answered: false,
    selectedIdx: null,
    lifelines: { fifty:false, audience:false, change:false },
    hidden: [],
    audiencePcts: null,
    categoriesSeen: new Set(),
    fastestFlag: false,
    ended: false,
    wrongAt: null,
  };
  state.screen = "play";
  render();
  startTimer();
}

function currentQ(){ return state.session.questions[state.session.index]; }

function startTimer(){
  clearInterval(state.timerInterval);
  const s = state.session;
  updateTimerDOM();
  state.timerInterval = setInterval(()=>{
    if(s.answered){ return; }
    s.timeLeft -= 1;
    if(s.timeLeft <= 0){
      s.timeLeft = 0;
      updateTimerDOM();
      clearInterval(state.timerInterval);
      handleAnswer(-1); // tiempo agotado = fallo
      return;
    }
    updateTimerDOM();
  }, 1000);
}

function updateTimerDOM(){
  const s = state.session;
  const ring = document.getElementById("timerRingFg");
  const numEl = document.getElementById("timerNum");
  if(!ring || !numEl) return;
  const circumference = 2*Math.PI*32;
  const pct = s.timeLeft / TIME_PER_Q;
  ring.style.strokeDashoffset = (circumference*(1-pct)).toFixed(1);
  numEl.textContent = s.timeLeft;
  ring.style.stroke = s.timeLeft<=5 ? "var(--coral)" : (s.timeLeft<=12 ? "var(--gold)" : "var(--teal)");
}

/* ---------------- Comodines ---------------- */
function useFifty(){
  const s = state.session;
  if(s.lifelines.fifty || s.answered) return;
  s.lifelines.fifty = true;
  const q = currentQ();
  const wrongIdx = q.options.map((o,i)=>i).filter(i=>!q.options[i].correct);
  s.hidden = shuffle(wrongIdx).slice(0,2);
  render();
}
function useAudience(){
  const s = state.session;
  if(s.lifelines.audience || s.answered) return;
  s.lifelines.audience = true;
  const q = currentQ();
  const correctIdx = q.options.findIndex(o=>o.correct);
  const pcts = [0,0,0,0].slice(0,q.options.length);
  pcts[correctIdx] = 45 + Math.floor(Math.random()*30);
  let rest = 100 - pcts[correctIdx];
  q.options.forEach((o,i)=>{
    if(i!==correctIdx){
      const take = i===q.options.length-1 ? rest : Math.floor(Math.random()*(rest/1.5));
      pcts[i] = Math.max(2, Math.min(take, rest));
      rest -= pcts[i];
    }
  });
  s.audiencePcts = pcts;
  render();
}
function useChange(){
  const s = state.session;
  if(s.lifelines.change || s.answered) return;
  const used = new Set(s.questions.map(q=>q.question));
  let pool = (state.categoryFilter==="Todas" ? QUESTIONS : QUESTIONS.filter(q=>q.cat===state.categoryFilter))
    .filter(q=>!used.has(q.q));
  if(pool.length===0) pool = QUESTIONS.filter(q=>!used.has(q.q));
  if(pool.length===0) return;
  s.lifelines.change = true;
  const q = shuffle(pool)[0];
  const order = shuffle(q.opts.map((text,i)=>({text, correct:i===q.correct})));
  s.questions[s.index] = { cat:q.cat, question:q.q, options: order };
  s.hidden = [];
  s.audiencePcts = null;
  s.timeLeft = TIME_PER_Q;
  render();
  startTimer();
}

/* ---------------- Responder ---------------- */
function handleAnswer(idx){
  const s = state.session;
  if(s.answered) return;
  s.answered = true;
  s.selectedIdx = idx;
  clearInterval(state.timerInterval);

  const q = currentQ();
  s.categoriesSeen.add(q.cat);
  const isCorrect = idx>=0 && q.options[idx].correct;
  state.user.totalAnswered += 1;

  if(s.timeLeft > 20) s.fastestFlag = true;

  if(isCorrect){
    const gained = XP_LADDER[s.index] || 600;
    s.xpEarned += gained;
    s.correctCount += 1;
    state.user.totalCorrect += 1;
  } else {
    s.wrongAt = s.index;
  }
  render();

  const delay = isCorrect ? 1300 : 2200;
  setTimeout(()=>{
    if(isCorrect && s.index < s.questions.length-1){
      s.index += 1;
      s.answered = false;
      s.selectedIdx = null;
      s.hidden = [];
      s.audiencePcts = null;
      s.timeLeft = TIME_PER_Q;
      render();
      startTimer();
    } else {
      finishSession(isCorrect);
    }
  }, delay);
}

function finishSession(lastCorrect){
  const s = state.session;
  s.ended = true;
  const u = state.user;
  u.xp += s.xpEarned;
  u.gamesPlayed += 1;
  if(s.correctCount === s.questions.length) u.perfectRounds += 1;
  if(s.fastestFlag) u.fastestAnswer = true;
  u.categoriesPlayed = Array.from(new Set([...(u.categoriesPlayed||[]), ...Array.from(s.categoriesSeen)]));
  registerPlayToday();

  const before = new Set(u.unlockedBadges);
  const newly = [];
  BADGES.forEach(b=>{
    if(!before.has(b.id) && b.check(u)){ u.unlockedBadges.push(b.id); newly.push(b); }
  });
  s.newBadges = newly;

  saveUser();
  state.screen = "results";
  render();
}

function exitSession(){
  if(state.session && !state.session.ended){
    if(!confirm("¿Salir del reto? Perderás el progreso de esta ronda.")) return;
  }
  clearInterval(state.timerInterval);
  state.session = null;
  state.screen = "home";
  render();
}

/* ============================================================
   RENDER: PLAY
   ============================================================ */
function renderPlay(){
  const s = state.session;
  const q = currentQ();
  const letters = ["A","B","C","D"];
  const circumference = 2*Math.PI*32;

  const answersHtml = q.options.map((o,i)=>{
    let cls = "answer-btn";
    if(s.hidden.includes(i)) cls += " faded locked";
    if(s.answered){
      cls += " locked";
      if(o.correct) cls += " correct";
      else if(i===s.selectedIdx) cls += " wrong";
    }
    const mark = s.answered ? (o.correct ? "✓" : (i===s.selectedIdx ? "✕" : "")) : "";
    return `<button class="${cls}" ${s.hidden.includes(i)?'disabled':''} onclick="handleAnswer(${i})">
      <span class="letter">${letters[i]}</span>
      <span>${escapeHtml(o.text)}</span>
      ${mark?`<span class="mark">${mark}</span>`:""}
    </button>`;
  }).join("");

  const audienceHtml = s.audiencePcts ? `
    <div class="audience-box glass glass-tight fade-in">
      ${q.options.map((o,i)=>`
        <div class="audience-row">
          <span class="al">${letters[i]}</span>
          <div class="audience-bar-track"><div class="audience-bar-fill" style="width:${s.audiencePcts[i]}%"></div></div>
          <span class="audience-pct">${s.audiencePcts[i]}%</span>
        </div>`).join("")}
    </div>` : "";

  let feedbackHtml = "";
  if(s.answered){
    const correctOpt = q.options.find(o=>o.correct);
    const wasCorrect = s.selectedIdx>=0 && q.options[s.selectedIdx].correct;
    if(wasCorrect){
      feedbackHtml = `<div class="feedback-banner ok">✅ &nbsp;¡Correcto! Vas muy bien.<span class="xp-gain">+${XP_LADDER[s.index]} XP</span></div>`;
    } else {
      feedbackHtml = `<div class="feedback-banner bad">❌ &nbsp;${s.selectedIdx===-1?'Se acabó el tiempo.':'No era esa.'} La respuesta era: <b>${escapeHtml(correctOpt.text)}</b></div>`;
    }
  }

  const pathHtml = s.questions.map((_,i)=>{
    let cls="path-node";
    if(i<s.index || (i===s.index && s.answered && s.selectedIdx>=0 && currentQ().options[s.selectedIdx]?.correct)) cls+=" done";
    if(i===s.index && !(s.answered)) cls+=" current";
    return `<div class="${cls}">${i+1}</div>`;
  }).join("");

  return `
  <div class="fade-in">
    <div class="play-top">
      <button class="icon-btn" onclick="exitSession()">${ICONS.back}</button>
      <span class="cat-chip">${escapeHtml(q.cat)}</span>
      <span class="q-progress-text">Pregunta ${s.index+1}/${s.questions.length} · ${s.xpEarned} XP</span>
    </div>

    <div class="path-strip">${pathHtml}</div>

    <div class="timer-wrap">
      <div class="timer-ring-box">
        <svg viewBox="0 0 74 74">
          <circle class="timer-ring-bg" cx="37" cy="37" r="32"></circle>
          <circle id="timerRingFg" class="timer-ring-fg" cx="37" cy="37" r="32"
            stroke-dasharray="${circumference}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-num" id="timerNum">${s.timeLeft}</div>
      </div>
    </div>

    <div class="q-card glass">
      <div class="q-text">${escapeHtml(q.question)}</div>
      <div class="answers-grid">${answersHtml}</div>
    </div>

    ${audienceHtml}
    ${feedbackHtml}

    <div class="lifelines">
      <button class="life-btn" ${s.lifelines.fifty||s.answered?'disabled':''} onclick="useFifty()"><span class="lemo">🎯</span>50/50</button>
      <button class="life-btn" ${s.lifelines.audience||s.answered?'disabled':''} onclick="useAudience()"><span class="lemo">👥</span>Público</button>
      <button class="life-btn" ${s.lifelines.change||s.answered?'disabled':''} onclick="useChange()"><span class="lemo">🔁</span>Cambiar</button>
    </div>
  </div>`;
}

/* ============================================================
   RENDER: RESULTS
   ============================================================ */
function renderResults(){
  const s = state.session;
  const u = state.user;
  const total = s.questions.length;
  const pct = Math.round((s.correctCount/total)*100);
  const circumference = 2*Math.PI*70;
  const offset = circumference*(1-pct/100);
  const ringColor = pct===100 ? "var(--gold)" : (pct>=50 ? "var(--teal)" : "var(--coral)");

  let title, sub;
  if(pct===100){ title="¡Cima alcanzada! 🏔️"; sub="Respondiste todo correctamente. Eres imparable."; }
  else if(pct>=70){ title="¡Gran ascenso!"; sub="Estuviste muy cerca de la cima. Sigue así."; }
  else if(pct>=40){ title="Buen intento"; sub="Vas tomando ritmo, cada reto te hace más fuerte."; }
  else { title="Sigue subiendo"; sub="Todos empiezan en la base. La práctica te llevará más arriba."; }

  // recomendación simple según categoría jugada
  const reco = pct>=70
    ? `Dominas bien <b>${escapeHtml(state.categoryFilter==='Todas'?'esta mezcla de temas':state.categoryFilter)}</b>. Prueba otra categoría para seguir creciendo.`
    : `Repasa un poco más de <b>${escapeHtml(state.categoryFilter==='Todas'?'estos temas':state.categoryFilter)}</b> y vuelve a intentarlo: cada intento suma XP.`;

  const badgesHtml = (s.newBadges && s.newBadges.length) ? `
    <div class="section-label">🎁 Logros desbloqueados</div>
    <div class="badge-unlock-row">
      ${s.newBadges.map((b,i)=>`
        <div class="badge-card-mini glass glass-tight" style="animation-delay:${i*0.12}s">
          <div class="bicon">${b.icon}</div>
          <div class="bname">${b.name}</div>
        </div>`).join("")}
    </div>` : "";

  return `
  <div class="fade-in">
    ${topbarHTML()}

    <div class="results-hero glass">
      <div class="score-ring-box">
        <svg viewBox="0 0 160 160">
          <circle class="score-ring-bg" cx="80" cy="80" r="70"></circle>
          <circle class="score-ring-fg" id="scoreRing" cx="80" cy="80" r="70"
            stroke="${ringColor}" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"></circle>
        </svg>
        <div class="score-ring-label">
          <div class="pct" id="pctNum">0%</div>
          <div class="frac">${s.correctCount}/${total} correctas</div>
        </div>
      </div>
      <div class="results-title">${title}</div>
      <div class="results-sub">${sub}</div>
    </div>

    <div class="results-stats">
      <div class="rs-card glass glass-tight"><div class="num">+${s.xpEarned}</div><div class="lbl">XP ganada</div></div>
      <div class="rs-card glass glass-tight"><div class="num">🔥 ${u.streak}</div><div class="lbl">Racha</div></div>
      <div class="rs-card glass glass-tight"><div class="num">Nv.${computeLevel(u.xp).level}</div><div class="lbl">Nivel actual</div></div>
    </div>

    ${badgesHtml}

    <div class="section-label">💡 Recomendación</div>
    <div class="reco-box glass glass-tight"><span class="ricon">🧠</span><p>${reco}</p></div>

    <div class="results-actions">
      <button class="cta-main" onclick="startSession()"><div class="shine"></div>${ICONS.mountain} Jugar de nuevo</button>
      <button class="btn-secondary" onclick="openProgress()">Ver mi progreso</button>
      <button class="btn-secondary" onclick="goHomeFromResults()">Volver al inicio</button>
    </div>
  </div>`;
}

function goHomeFromResults(){ state.session=null; state.screen="home"; render(); }

function animateResultsIn(){
  const s = state.session;
  const total = s.questions.length;
  const pct = Math.round((s.correctCount/total)*100);
  const circumference = 2*Math.PI*70;
  const ring = document.getElementById("scoreRing");
  const numEl = document.getElementById("pctNum");
  if(!ring || !numEl) return;
  requestAnimationFrame(()=>{
    ring.style.strokeDashoffset = (circumference*(1-pct/100)).toFixed(1);
  });
  let cur = 0;
  const step = Math.max(1, Math.round(pct/30));
  const iv = setInterval(()=>{
    cur = Math.min(pct, cur+step);
    numEl.textContent = cur+"%";
    if(cur>=pct) clearInterval(iv);
  }, 25);
}

/* ============================================================
   RENDER: PROGRESS OVERLAY
   ============================================================ */
function openProgress(){ state.showProgress = true; render(); }
function closeProgress(){ state.showProgress = false; render(); }

function renderProgressOverlay(){
  const u = state.user;
  const lv = computeLevel(u.xp);
  const accuracy = u.totalAnswered ? Math.round((u.totalCorrect/u.totalAnswered)*100) : 0;

  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const lbl = d.toLocaleDateString('es-ES', {weekday:'short'}).slice(0,1).toUpperCase();
    days.push({iso, lbl, filled: (u.playDates||[]).includes(iso)});
  }

  const badgesHtml = BADGES.map(b=>{
    const unlocked = u.unlockedBadges.includes(b.id);
    return `<div class="badge-card glass glass-tight ${unlocked?'':'locked'}">
      <div class="bicon">${unlocked?b.icon:'🔒'}</div>
      <div class="bname">${b.name}</div>
      <div class="bdesc">${b.desc}</div>
    </div>`;
  }).join("");

  return `
  <div class="overlay" onclick="if(event.target===this) closeProgress()">
    <div class="sheet glass">
      <div class="sheet-head">
        <div class="sheet-title">Tu progreso</div>
        <button class="icon-btn" onclick="closeProgress()">✕</button>
      </div>

      <div class="level-pill" style="margin-bottom:10px;"><span class="dot"></span>Nivel ${lv.level} · ${lv.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${lv.pct}%"></div></div>
      <div class="xp-row" style="margin-top:7px;"><span class="lbl">Hacia nivel ${lv.level+1}</span><span class="val">${lv.into}/${lv.span} XP</span></div>

      <div class="section-label">📅 Esta semana</div>
      <div class="week-strip">
        ${days.map(d=>`<div class="week-day"><div class="wd-lbl">${d.lbl}</div><div class="wd-dot ${d.filled?'filled':''}">${d.filled?'🔥':''}</div></div>`).join("")}
      </div>

      <div class="section-label">📈 Estadísticas</div>
      <div class="lifetime-grid">
        <div class="rs-card glass glass-tight"><div class="num">${u.gamesPlayed}</div><div class="lbl">Retos jugados</div></div>
        <div class="rs-card glass glass-tight"><div class="num">${accuracy}%</div><div class="lbl">Precisión global</div></div>
        <div class="rs-card glass glass-tight"><div class="num">${u.totalCorrect}</div><div class="lbl">Correctas totales</div></div>
        <div class="rs-card glass glass-tight"><div class="num">${u.perfectRounds}</div><div class="lbl">Cimas perfectas</div></div>
      </div>

      <div class="section-label">🏅 Logros (${u.unlockedBadges.length}/${BADGES.length})</div>
      <div class="badges-grid">${badgesHtml}</div>
    </div>
  </div>`;
}

/* ============================================================
   RENDER MASTER
   ============================================================ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function render(){
  applyTheme();
  let html = "";
  if(state.screen==="home") html = renderHome();
  else if(state.screen==="play") html = renderPlay();
  else if(state.screen==="results") html = renderResults();

  if(state.showProgress) html += renderProgressOverlay();

  app.innerHTML = html;

  if(state.screen==="play" && state.session && !state.session.ended) updateTimerDOM();
  if(state.screen==="results") setTimeout(animateResultsIn, 60);
}

render();
</script>
</body>
</html>
